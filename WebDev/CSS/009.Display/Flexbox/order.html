<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox - 2 </title>
</head>
<style>
    .parent-box {
        display: flex;
        /* flex-wrap: wrap; */
        flex-wrap: wrap-reverse;
        gap: 40px;
    }

    .child-box {
        height: 200px;
        width: 200px;
        /* flex-grow: 1; */
        /* flex-wrap: nowrap; */


        padding: 50px 30px;
        background-color: rgb(236, 55, 55);
        margin: 5px;
    }

    .box-1 {
        /* flex-grow: 1; */
        order: 1;
    }

    .box-4 {
        /* flex-grow: 2; */
        order: -1;
    }

    /* -1 0 0 1  */
</style>

<body>
    <section class="parent-box">
        <div class="child-box box-1">1</div>
        <div class="child-box box-2">2</div>
        <div class="child-box box-3">3</div>
        <div class="child-box box-4">4</div>
    </section>
</body>

</html>
