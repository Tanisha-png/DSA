<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Makes webpage responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab title -->
    <title>Colors in CSS</title>

    <!-- External CSS File -->
    <link rel="stylesheet" href="01.colors.css">

</head>

<body>

    <!--
        CSS Colors

        CSS provides multiple ways to define colors.

        1. Color Keywords
        2. Hexadecimal Values
        3. RGB / RGBA
        4. HSL / HSLA
    -->



    <!--
        Where can colors be applied?

        Almost every visible HTML element can have colors.

        Common places:

        1. Text Color
        2. Background Color
        3. Border Color
        4. Outline Color
        5. Box Shadow
        6. Text Shadow
    -->



    <!--
        HTML elements that commonly use colors

        Text Elements

        h1-h6
        p
        pre
        a
        span
        li
        ol
        ul
        button
        label
    -->



    <!--
        Example

        This code is commented, so it will not execute.
    -->

    <!--

    <h1>This is Heading</h1>

    <a href="https://www.google.com">Google</a>

    <a href="https://www.google.com">Google</a>

    <style>

        a{

            color:#ccd309;

        }

    </style>

    -->


    <!--
        Paragraph

        The CSS file currently applies RGBA color
        and font-size to this paragraph.
    -->

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Eveniet, sed?</p>

</body>

</html>
