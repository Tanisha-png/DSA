<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout 8-1</title>
</head>

<style>
    .dashboard-8 {
            display: flex;

            min-height: 450px;
        }

        .dashboard-sidebar-8 {
            flex: 0 0 220px;

            padding: 25px;

            background: #222;
            color: white;
        }

        .dashboard-sidebar-8 a {
            display: block;

            padding: 12px 0;

            color: white;
            text-decoration: none;
        }

        .dashboard-main-8 {
            flex: 1;

            padding: 25px;

            background: #f2f2f2;
        }

        .dashboard-stats-8 {
            display: flex;

            gap: 20px;
        }

        .dashboard-stat-8 {
            flex: 1;

            padding: 25px;

            background: white;
        }
</style>

<body>
    <section class="example">
    
        <h2 class="example-title">
            8. Dashboard Layout
        </h2>
    
        <p class="example-description">
            Real application layout with sidebar and main content.
        </p>
    
    
        <section class="dashboard-8">
    
    
            <aside class="dashboard-sidebar-8">
    
                <h3>
                    Dashboard
                </h3>
    
                <a href="#">
                    Home
                </a>
    
                <a href="#">
                    Users
                </a>
    
                <a href="#">
                    Orders
                </a>
    
                <a href="#">
                    Settings
                </a>
    
            </aside>
    
    
            <main class="dashboard-main-8">
    
                <h2>
                    Overview
                </h2>
    
    
                <div class="dashboard-stats-8">
    
    
                    <div class="dashboard-stat-8">
    
                        <h3>
                            Users
                        </h3>
    
                        <p>
                            1,250
                        </p>
    
                    </div>
    
    
                    <div class="dashboard-stat-8">
    
                        <h3>
                            Orders
                        </h3>
    
                        <p>
                            450
                        </p>
    
                    </div>
    
    
                    <div class="dashboard-stat-8">
    
                        <h3>
                            Revenue
                        </h3>
    
                        <p>
                            ₹85,000
                        </p>
    
                    </div>
    
    
                </div>
    
            </main>
    
    
        </section>
    
    </section>
</body>

</html>
