<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layouts 6</title>
</head>

<style>
    .container {
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
    }

    .cards {
        border: 2px solid rgb(202, 201, 201);
        margin: 20px;
        width: 400px;
        height: 300px;
    }

    .spacing {
        padding: 20px;
    }
</style>

<body>
    <section class="container">

        <div class="cards">
            <img src="https://www.excelsior.edu/wp-content/uploads/2025/01/computer-programming-vs-computer-science-image_blog.jpg" alt="HTML" height="150px" width="100%">
            <div class="spacing">
                <h2>Learn HTML</h2>
                <p>A beginner guide to HTML</p>
            </div>
        </div>

        <div class="cards">
            <img src="https://www.excelsior.edu/wp-content/uploads/2025/01/computer-programming-vs-computer-science-image_blog.jpg" alt="CSS" height="150px" width="100%">
            <div class="spacing">
                <h2>Learn CSS</h2>
                <p>Build beautiful websites</p>
            </div>
        </div>

        <div class="cards">
            <img src="https://www.excelsior.edu/wp-content/uploads/2025/01/computer-programming-vs-computer-science-image_blog.jpg" alt="JS" height="150px" width="100%">
            <div class="spacing">
                <h2>Learn JavaScript</h2>
                <p>Make website interactive</p>
            </div>
        </div>

    </section>
</body>
</html>
