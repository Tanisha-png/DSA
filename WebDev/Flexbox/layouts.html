<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layouts</title>
</head>

<style>
    .parent {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 2px solid black;
        background-color: rgb(11, 11, 11);
        color: white;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }

    .buttons {
        display: flex;
        gap: 10px;
        padding: 8px;
    }

    .logo {
        padding: 10px;
        margin: 8px;
    }

    .parent-2 {
        display: flex;
        justify-content: space-evenly;
        margin-top: 10px;
        align-items: center;
        border: 2px solid gray;
        background-color: rgb(11, 11, 11);
        color: white;
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
    }

    .nav-menu {
        display: flex;
        gap: 20px;
    }

    .hero-section {
        display: flex;
        align-items: center;
        background-color: rgb(232, 243, 255);
        font-size: 20px;
        padding-left: 8px;
        padding-bottom: 8px;
    }

    .learning {
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    }

    .btn {
        background: black;
        color: white;
        border: none;
        padding: 10px 18px;
        cursor: pointer;
    }

    .cover-right {
        display: flex;
        justify-content: center;
        align-items: center;
        border: 2px solid gray;
        width: 100%;
        height: 250px;
        background: gray;
    }

    .image {
        width: 50%;
        padding: 20px;
        height: 80%;
    }
</style>

<body>

    <section class="container">

        <div class="parent">
            <div class="logo">
                <h1>TechLearn</h1>
            </div>
            
            <div class="buttons">
                <button>Login</button>
                <button>Sign Up</button>
            </div>
        </div>

        <div class="parent-2">
            <div class="nav-menu">
                <h2>Home</h2>
                <h2>Courses</h2>
                <h2>Projects</h2>
                <h2>About</h2>
                <h2>Contact</h2>
            </div>
        </div>

        <div class="hero-section">
            <div class="learning">
                <h2>Learn Programming</h2>
                <p>Learn programming through practical projects and real world examples.</p>
                <button class="btn">Start Learning</button>
            </div>


            <div class="image">
                <div class="cover-right">
                    <h2 class="course">Course Image</h2>
                </div>
            </div>
        </div>

    </section>
</body>
</html>
