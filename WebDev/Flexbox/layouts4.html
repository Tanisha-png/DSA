    <title>Layouts 4</title>

<style>

        display: flex;

        margin: 20px;
        border: 1px solid gray;
        padding: 15px 10px;
    }

<body>

            </div>

            <div class="cards">

                <h2>App Development</h2>
                <p>Build mobile applications</p>
            </div>

            <div class="cards">
                <img src="https://static.vecteezy.com/system/resources/thumbnails/005/502/367/small/solid-cloud-illustration-glyph-icon-free-vector.jpg" alt="cloud" height="30px" width="30px">
