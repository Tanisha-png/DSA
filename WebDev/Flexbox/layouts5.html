<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layouts 5</title>
</head>

<style>
    .container {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .cards {
        text-align: center;
        width: 25%;
        margin: 20px;
        border: 2px solid gray;
        padding: 15px 10px;
    }

    button {
        width: 100%;
        border: none;
        background: black;
        color: white;
        cursor: pointer;
        padding: 10px 18px;
    }
</style>

<body>
    <section class="container">

        <div class="cards">
            <h2>Basic</h2>
            <p>499</p>
            <p>5 projects</p>
            <p>Email Support</p>
            <button>Choose Plan</button>
        </div>

        <div class="cards">
            <h2>Professional</h2>
            <p>999</p>
            <p>Unlimited Projects</p>
            <p>Priority Support</p>
            <button>Choose Plan</button>
        </div>

        <div class="cards">
            <h2>Enterprise</h2>
            <p>1999</p>
            <p>Team Features</p>
            <p>Dedicated Support</p>
            <button>Choose Plan</button>
        </div>
    </section>
</body>
</html>
