<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragraph in HTML</title>
</head>

<body>

    <p>This is a paragraph.</p>
    <p>Each paragraph starts on a new line.</p>


    <!-- Paragraphs automatically include spacing. -->
    <pre>
Name : John
Age  : 20
</pre>
    <!-- The pre tag preserves spaces and line breaks. -->
</body>

</html>
