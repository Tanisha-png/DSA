<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Tag in HTML</title>
</head>

<body>
    <p>Section One</p>
    <hr>
    <p>Section Two</p>
</body>
<!-- `hr` draws a horizontal separator. -->

</html>
