<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in HTML</title>
</head>

<body>
    <!-- Forms -->

    <form action="">

        <!-- <input type="text" />
    <input type="password" />

    <input type="button" value="Click Me" />

    <input type="date" />

    <input type="checkbox" />
    <input type="radio" /> -->


        <label for="">Name:</label>
        <input type="text">
        <br>
        <br>

        <!-- <input type="text" placeholder="Enter your name"> -->
        <label for="">Email : </label>
        <input type="email" name="" id="">

        <br><br>
        <input type="radio" id="apple" name="fruit" value="apple" checked>
        <label for="apple">Apple</label><br>

        <input type="radio" id="banana" name="fruit" value="banana">
        <label for="banana">Banana</label><br>

        <input type="radio" id="orange" name="fruit" value="orange">
        <label for="orange">Orange</label>

        <br><br>
        <input type="checkbox" id="hobby1" name="hobbies" value="reading" checked>
        <label for="hobby1">Reading</label><br>

        <input type="checkbox" id="hobby2" name="hobbies" value="gaming">
        <label for="hobby2">Gaming</label><br>

        <input type="checkbox" id="hobby3" name="hobbies" value="sports">
        <label for="hobby3">Sports</label>

        <br><br>

        <label for="">Date of Birth</label>
        <input type="date" />

        <br><br>
        <label for="feedback">Leave your comment:</label>
        <textarea id="feedback" name="feedback" rows="4" cols="50">
            This is default text that appears inside the textarea.
        </textarea>
        <br><br>

        <input type="button" value="Submit">
    </form>
</body>

</html>
