<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images in HTML</title>
</head>

<body>

    <!-- image -->
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ4Lm8-9_nev3i5nE5WRs4iYMLhijc6W-3RxA5Vju8Nag&s=10"

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFlUVYstUt4FmOWicqrtcfAJc7dq7B8917HS0VnWTppw&s=10"
        alt="Another Image" width="100px">

        alt="Website banner" width="100px">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFlUVYstUt4FmOWicqrtcfAJc7dq7B8917HS0VnWTppw&s=10"

</html>
