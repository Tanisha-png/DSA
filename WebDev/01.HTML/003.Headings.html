<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headings in HTML</title>
</head>

<body>
    <h1>Main Heading</h1>
    <h2>Section</h2>
    <h3>Subsection</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>
</body>

</html>


<!-- Use one h1 per page and follow a logical hierarchy. -->
